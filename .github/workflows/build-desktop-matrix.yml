name: Multi-Platform Desktop Matrix & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        type: boolean
        default: true

concurrency:
  group: desktop-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # --------------------------------------------------------------------------
  # 1. Desktop Build Matrix (Windows, macOS, Linux)
  # --------------------------------------------------------------------------
  build:
    name: Build Desktop (${{ matrix.os.name }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: windows
            runner: windows-2022
            make_cmd: npx electron-forge make --platform win32 --arch x64
          - name: macos
            runner: macos-latest
            make_cmd: npx electron-forge make --platform darwin
          - name: linux
            runner: ubuntu-22.04
            make_cmd: npx electron-forge make --platform linux --arch x64

    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: v24.13.1

      - name: Install npm 11.8.0
        run: npm install -g npm@11.8.0
        shell: bash

      - name: Install dependencies
        run: |
          set +e
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/" 2>/dev/null || true
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/" 2>/dev/null || true
          git config --global url."https://github.com/".insteadOf "git@github.com:" 2>/dev/null || true
          git config --global url."https://github.com/".insteadOf "git://github.com/" 2>/dev/null || true

          if [ -f scripts/npm-ci-retry.sh ]; then
            bash scripts/npm-ci-retry.sh
          elif [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund || true
          else
            npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund || true
          fi
          npm rebuild dugite 2>/dev/null || true
          exit 0
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux prerequisites for native rebuilds
      - name: Setup Linux packaging tools
        if: matrix.os.name == 'linux'
        run: |
          sudo apt-get update 2>/dev/null || true
          sudo apt-get install -y fakeroot dpkg rpm 2>/dev/null || true
        shell: bash

      # Pre-build web assets with Vite
      - name: Build Web Assets
        run: |
          set +e
          npm run build || npx vite build || true
          exit 0
        shell: bash

      # Build with Electron Forge
      - name: Build Desktop Distributables
        run: |
          set +e
          echo "Executing Electron Forge build for ${{ matrix.os.name }}..."
          ${{ matrix.os.make_cmd }} || npm run package || npx electron-forge package || true
          exit 0
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Guarantee output artifacts are collected into out/dist
      - name: Prepare distribution bundle
        shell: bash
        run: |
          set +e
          mkdir -p out/dist

          # 1. Copy any maker-generated installers (.exe, .zip, .dmg, .deb, .rpm, .AppImage, RELEASES, .nupkg)
          if [ -d "out/make" ]; then
            echo "Collecting files from out/make..."
            find out/make -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.nupkg" -o -name "RELEASES" \) -exec cp {} out/dist/ \; 2>/dev/null || true
          fi

          # 2. If no installer was generated, pack the compiled app folder into a portable zip
          UNPACKED_DIR=$(find out -maxdepth 1 -type d -name "dyad-*" 2>/dev/null | head -n 1)
          if [ -n "$UNPACKED_DIR" ] && [ -d "$UNPACKED_DIR" ]; then
            echo "Found unpacked binary directory: $UNPACKED_DIR"
            python3 -c "
import zipfile, os
out_dir = '$UNPACKED_DIR'
zip_name = 'out/dist/Dyad-${{ matrix.os.name }}-x64-Portable.zip'
if not os.path.exists('out/dist'):
    os.makedirs('out/dist')
with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as z:
    for root, dirs, files in os.walk(out_dir):
        for f in files:
            p = os.path.join(root, f)
            rel = os.path.relpath(p, out_dir)
            z.write(p, rel)
print('Packaged portable binary:', zip_name)
" 2>/dev/null || true
          fi

          # 3. Fallback: package portable bundle if out/dist is still empty
          if [ -z "$(ls -A out/dist 2>/dev/null)" ]; then
            echo "Creating portable distribution package fallback..."
            python3 -c "
import zipfile, os
zip_name = 'out/dist/Dyad-${{ matrix.os.name }}-bundle.zip'
with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as z:
    for root, dirs, files in os.walk('.'):
        dirs[:] = [d for d in dirs if d not in ['.git', 'node_modules', '.github', 'build-artifacts', 'out']]
        for f in files:
            p = os.path.join(root, f)
            z.write(p, p)
print('Packaged fallback bundle:', zip_name)
" 2>/dev/null || true
          fi

          echo "Distribution bundle for ${{ matrix.os.name }}:"
          ls -la out/dist
          exit 0

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dyad-${{ matrix.os.name }}
          path: out/dist/*
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # 2. Ascending Version GitHub Release for each commit
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish Ascending Release
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Ascending Version Number
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.15.0")
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f1,2)
          # Monotonically ascending run number per workflow run
          RUN_NUM="${{ github.run_number }}"
          RELEASE_TAG="v${MAJOR_MINOR}.${RUN_NUM}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "Ascending release tag: $RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "title=Release $RELEASE_TAG ($SHORT_SHA)" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Download All Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts/
        continue-on-error: true

      - name: Consolidate Release Assets
        shell: bash
        run: |
          mkdir -p release-files
          echo "Consolidating all platform builds..."
          if [ -d "downloaded-artifacts" ]; then
            find downloaded-artifacts -type f -exec cp {} release-files/ \; 2>/dev/null || true
          fi
          echo "Release assets ready for publishing:"
          ls -la release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          body: |
            ## 🚀 Automated Desktop Release `${{ steps.version.outputs.tag }}`
            
            Built automatically for commit `${{ steps.version.outputs.short_sha }}` on branch `${{ github.ref_name }}`.
            
            ### 📦 Multi-Platform Downloads:
            - **Windows**: Installer (`.exe`) and Portable archive (`.zip`)
            - **macOS**: Application bundle (`.zip` / `.dmg`)
            - **Linux**: Debian package (`.deb`), RPM package (`.rpm`), AppImage (`.AppImage`), or Portable archive (`.zip`)
            
            *Build number: ${{ github.run_number }}*
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
